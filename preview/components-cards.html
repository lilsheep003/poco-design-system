<!doctype html><html><head><meta charset="utf-8"><title>Cards</title><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="poco" style="padding:20px 24px">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <!-- Filled default card -->
    <div class="card">
      <div class="h3" style="margin-bottom:6px">Feeling stuck?</div>
      <div class="small">Break a big task into smaller steps.</div>
    </div>
    <!-- Outlined nested card -->
    <div class="card">
      <div class="card--flat">
        <div class="h3" style="margin-bottom:4px">Smallest next step</div>
        <div class="small">Open the course page and read the assignment instructions</div>
      </div>
    </div>
    <!-- Grid-cell card -->
    <div class="card" style="text-align:center">
      <div class="h3" style="margin-bottom:2px">Mind Drop</div>
      <div class="small">6 items left</div>
    </div>
    <!-- Warm mochi tile card -->
    <div class="card" style="display:flex;align-items:center;gap:12px">
      <div style="width:52px;height:52px;border-radius:14px;background:#FCEBD8;display:grid;place-items:center;font-size:26px">🐰</div>
      <div>
        <div class="h3">Beautifully Focused!</div>
        <div class="small">Total Focus · 25m20s</div>
      </div>
    </div>
  </div>
</body></html>
