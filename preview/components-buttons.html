<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="poco" style="padding:20px 24px">
  <div style="display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn btn--primary">Start Focus</button>
      <button class="btn btn--secondary">Break Down</button>
      <button class="btn btn--soft">That's me today !</button>
      <button class="btn btn--light">Save to Today</button>
      <button class="btn btn--ghost">Restart</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn btn--primary" style="padding:10px 16px;font-size:14px">Start Now</button>
      <button class="btn btn--soft" style="padding:10px 16px;font-size:14px">Open reflection</button>
      <button class="btn btn--soft" style="padding:6px 12px;font-size:13px">Update</button>
      <button class="btn btn--secondary" style="padding:6px 12px;font-size:13px">Configure</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button class="btn btn--primary" style="width:100%;max-width:320px">Break Down</button>
    </div>
    <div class="micro" style="font-size:11px;color:var(--poco-ink-3);letter-spacing:.04em;text-transform:uppercase;margin-top:4px">Primary · Secondary · Soft · Light · Ghost</div>
  </div>
</body></html>
