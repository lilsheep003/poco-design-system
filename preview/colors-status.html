<!doctype html><html><head><meta charset="utf-8"><title>Status</title><link rel="stylesheet" href="_preview.css"></head>
<body>
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="row">
      <span style="display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:#F7C4C4;color:#8C2A2A;font-size:13px;font-weight:600">High</span>
      <span style="display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:#BCE5B9;color:#2C5A29;font-size:13px;font-weight:600">Easy</span>
      <span style="display:inline-flex;align-items:center;padding:5px 14px;border-radius:999px;background:#D9D9D9;color:#0E0E10;font-size:13px;font-weight:600">2/5 steps</span>
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#6B6B6B"><span style="width:10px;height:10px;border-radius:999px;background:#6FA8DC;display:inline-block"></span>In progress</span>
    </div>
    <div class="row">
      <div class="swatch"><div class="swatch__chip" style="background:#F7C4C4"></div><div class="swatch__name">Priority</div><div class="swatch__value">#F7C4C4</div></div>
      <div class="swatch"><div class="swatch__chip" style="background:#BCE5B9"></div><div class="swatch__name">Easy</div><div class="swatch__value">#BCE5B9</div></div>
      <div class="swatch"><div class="swatch__chip" style="background:#6FA8DC"></div><div class="swatch__name">Progress</div><div class="swatch__value">#6FA8DC</div></div>
      <div class="swatch"><div class="swatch__chip" style="background:#FCEBD8"></div><div class="swatch__name">Warm cream</div><div class="swatch__value">#FCEBD8</div></div>
    </div>
  </div>
</body></html>
