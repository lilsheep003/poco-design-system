<!doctype html><html><head><meta charset="utf-8"><title>Elevation</title><link rel="stylesheet" href="_preview.css"></head>
<body>
  <div style="display:flex;gap:18px;align-items:stretch">
    <!-- Filled card -->
    <div style="flex:1;padding:16px;background:#F2F2F2;border-radius:20px">
      <div class="swatch__name">Filled card</div>
      <div class="swatch__value">surface-1 · no shadow</div>
    </div>
    <!-- Outlined card -->
    <div style="flex:1;padding:16px;background:#FFFFFF;border:1px solid #E5E5E5;border-radius:16px">
      <div class="swatch__name">Outlined</div>
      <div class="swatch__value">1px · line</div>
    </div>
    <!-- Floating / pop -->
    <div style="flex:1;padding:16px;background:#FFFFFF;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06)">
      <div class="swatch__name">Floating</div>
      <div class="swatch__value">shadow-pop (rare)</div>
    </div>
  </div>
  <div style="margin-top:12px;font-size:12px;color:#6B6B6B">Poco is a borders-and-fills system. Shadows are reserved for bottom tab bar and occasional floating surfaces.</div>
</body></html>
