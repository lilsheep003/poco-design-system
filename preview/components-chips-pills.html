<!doctype html><html><head><meta charset="utf-8"><title>Chips & Pills</title><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="poco" style="padding:20px 24px">
  <div style="display:flex;flex-direction:column;gap:16px">
    <div>
      <div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6B6B6B;margin-bottom:8px">Selectable chips</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <span class="chip">Calm</span>
        <span class="chip">Okay</span>
        <span class="chip">Tired</span>
        <span class="chip" style="background:#0E0E10;color:#fff;border-color:#0E0E10">Anxious</span>
        <span class="chip">Motivate</span>
        <span class="chip">Overwhelmed</span>
      </div>
    </div>
    <div>
      <div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6B6B6B;margin-bottom:8px">Status pills</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span class="pill pill--priority">High</span>
        <span class="pill pill--easy">Easy</span>
        <span class="pill pill--neutral">2/5 steps</span>
        <span class="pill pill--neutral">Plan ready</span>
        <span class="pill pill--neutral">6 items left</span>
      </div>
    </div>
  </div>
</body></html>
