<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="_preview.css"></head>
<body>
  <div style="display:flex;align-items:flex-end;gap:20px">
    <!-- Each column: a bar at the token height, a value label -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:22px;height:4px;background:#0E0E10;border-radius:2px"></div><div class="swatch__name">s-1</div><div class="swatch__value">4</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:22px;height:8px;background:#0E0E10;border-radius:2px"></div><div class="swatch__name">s-2</div><div class="swatch__value">8</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:22px;height:12px;background:#0E0E10;border-radius:2px"></div><div class="swatch__name">s-3</div><div class="swatch__value">12</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:22px;height:16px;background:#0E0E10;border-radius:2px"></div><div class="swatch__name">s-4</div><div class="swatch__value">16</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:22px;height:20px;background:#0E0E10;border-radius:2px"></div><div class="swatch__name">s-5</div><div class="swatch__value">20</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:22px;height:24px;background:#0E0E10;border-radius:2px"></div><div class="swatch__name">s-6</div><div class="swatch__value">24</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:22px;height:32px;background:#0E0E10;border-radius:2px"></div><div class="swatch__name">s-8</div><div class="swatch__value">32</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:22px;height:40px;background:#0E0E10;border-radius:2px"></div><div class="swatch__name">s-10</div><div class="swatch__value">40</div></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:22px;height:48px;background:#0E0E10;border-radius:2px"></div><div class="swatch__name">s-12</div><div class="swatch__value">48</div></div>
  </div>
</body></html>
