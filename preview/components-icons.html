<!doctype html><html><head><meta charset="utf-8"><title>Iconography</title><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="poco" style="padding:20px 24px">
  <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:14px 10px;max-width:640px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="bell" style="width:22px;height:22px"></i>bell</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="user" style="width:22px;height:22px"></i>user</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="calendar" style="width:22px;height:22px"></i>calendar</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="settings" style="width:22px;height:22px"></i>settings</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="search" style="width:22px;height:22px"></i>search</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="filter" style="width:22px;height:22px"></i>filter</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="chevron-left" style="width:22px;height:22px"></i>back</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="chevron-right" style="width:22px;height:22px"></i>next</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="arrow-right-circle" style="width:22px;height:22px"></i>go</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="x-circle" style="width:22px;height:22px"></i>close</div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="battery-low" style="width:22px;height:22px"></i>bat-low</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="battery-medium" style="width:22px;height:22px"></i>bat-med</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="battery-full" style="width:22px;height:22px"></i>bat-full</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="smile" style="width:22px;height:22px"></i>smile</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="sprout" style="width:22px;height:22px"></i>sprout</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="check-circle-2" style="width:22px;height:22px"></i>done</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="circle" style="width:22px;height:22px"></i>radio</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="trash-2" style="width:22px;height:22px"></i>trash</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="house" style="width:22px;height:22px"></i>home</div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#6B6B6B"><i data-lucide="target" style="width:22px;height:22px"></i>target</div>
  </div>
  <div style="margin-top:14px;font-size:11px;color:#6B6B6B">Lucide · 1.8px stroke · 24px grid</div>
  <script>lucide.createIcons();</script>
</body></html>
