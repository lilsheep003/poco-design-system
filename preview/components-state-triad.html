<!doctype html><html><head><meta charset="utf-8"><title>State Triad</title><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="poco" style="padding:20px 24px">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="h3">How are you starting?</div>
      <span class="pill pill--neutral">Update</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
      <div style="background:#fff;border:1px solid #E5E5E5;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        <div style="font-weight:600;font-size:13px">Mood</div>
        <div style="font-size:12px;color:#6B6B6B">Calm</div>
      </div>
      <div style="background:#fff;border:1px solid #E5E5E5;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/><rect x="5" y="10" width="8" height="4" fill="#0E0E10"/></svg>
        <div style="font-weight:600;font-size:13px">Energy</div>
        <div style="font-size:12px;color:#6B6B6B">Medium</div>
      </div>
      <div style="background:#fff;border:1px solid #E5E5E5;border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E0E10" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20h10"/><path d="M12 20V10"/><path d="M12 10C8 10 6 8 6 5c3 0 6 1.5 6 5Z"/><path d="M12 10c4 0 6-2 6-5-3 0-6 1.5-6 5Z"/></svg>
        <div style="font-weight:600;font-size:13px">Focus</div>
        <div style="font-size:12px;color:#6B6B6B">Maybe</div>
      </div>
    </div>
  </div>
</body></html>
